{% extends 'base.html' %}

{% block title %}Log In | Local Lend a Hand{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="fs-1">🤝</span>
                    <h3 class="fw-bold mt-2 mb-1">Welcome Back</h3>
                    <p class="text-muted small">Log in with Firebase or choose a test persona</p>
                </div>

                <!-- Google OAuth Button -->
                <button class="btn btn-outline-dark w-100 py-2 fw-semibold mb-3 rounded-pill d-flex align-items-center justify-content-center gap-2" onclick="handleGoogleOAuth()">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Continue with Google
                </button>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1">
                    <span class="px-2 text-muted small">or with email</span>
                    <hr class="flex-grow-1">
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Email or Username</label>
                        <input type="text" class="form-control" name="email" required placeholder="om@example.com" value="om@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Password</label>
                        <input type="password" class="form-control" name="password" required value="password123">
                    </div>

                    <button type="submit" class="btn btn-emerald w-100 py-2 fw-bold rounded-pill mb-3">
                        Sign In
                    </button>
                </form>

                <div class="alert alert-light border small text-center mb-0">
                    <div class="fw-bold mb-1">Instant Demo Personas:</div>
                    <div class="d-flex justify-content-center gap-2">
                        <button class="btn btn-sm btn-outline-primary" onclick="switchDemoPersona('VOLUNTEER')">Om Sharma (Vol)</button>
                        <button class="btn btn-sm btn-outline-success" onclick="switchDemoPersona('NGO')">Care India (NGO)</button>
                    </div>
                </div>

                <div class="text-center mt-4 small">
                    Don't have an account? <br>
                    <a href="/auth/register/volunteer/" class="fw-bold text-success text-decoration-none">Join as Volunteer</a> &bull; 
                    <a href="/auth/register/ngo/" class="fw-bold text-primary text-decoration-none">Register as NGO (Darpan ID)</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
